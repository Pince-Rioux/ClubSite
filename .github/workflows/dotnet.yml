# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        path: repo
    - name: Checkout Membership RCL
      uses: actions/checkout@v4
      with:
        repository: Pince-Rioux/ClubSite.Membership
        path: Membership
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore repo/ClubSite.sln
    - name: Build
      run: dotnet build repo/ClubSite.sln --no-restore
    - name: Test
      run: dotnet test repo/ClubSite.sln --no-build --verbosity normal
